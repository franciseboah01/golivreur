# GoLivreur — Configuration Nginx Production
# Domaines : golivreur.ci + staging.golivreur.ci + admin.golivreur.ci
#
# INSTALLATION :
#   1. Copier ce fichier :
#      sudo cp nginx/production.conf /etc/nginx/sites-available/golivreur.ci
#   2. Activer :
#      sudo ln -s /etc/nginx/sites-available/golivreur.ci /etc/nginx/sites-enabled/
#   3. Tester :
#      sudo nginx -t
#   4. Obtenir le certificat SSL Let's Encrypt :
#      sudo certbot --nginx -d golivreur.ci -d staging.golivreur.ci \
#           -d admin.golivreur.ci --email francis@golivreur.ci --agree-tos
#   5. Recharger Nginx :
#      sudo systemctl reload nginx
#
# Let's Encrypt ajoutera automatiquement les blocs SSL après certbot

# ── Redirection HTTP → HTTPS (sera géré par certbot) ─────────────────────────
server {
    listen 80;
    server_name golivreur.ci staging.golivreur.ci admin.golivreur.ci;
    return 301 https://$server_name$request_uri;
}

# ── Production — golivreur.ci (API + Vitrine + Admin) ────────────────────────
server {
    listen 443 ssl http2;
    server_name golivreur.ci;

    root /var/www/production/public;
    index index.php;

    # SSL — certificats générés par certbot (ne pas modifier manuellement)
    # ssl_certificate et ssl_certificate_key seront ajoutés par certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # HSTS — Force HTTPS pendant 1 an
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille max upload (photos colis GoColis)
    client_max_body_size 12M;

    # Logs
    access_log /var/log/nginx/golivreur_access.log;
    error_log  /var/log/nginx/golivreur_error.log;

    # ── WebSocket Reverb (GPS temps réel) ─────────────────────────────────────
    # Proxy WebSocket vers Laravel Reverb sur le port 8080
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24h pour les connexions WebSocket persistantes
    }

    # ── Routes Laravel ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Fichiers statiques ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # ── Bloquer les accès sensibles ────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    # Bloquer l'accès direct aux dossiers de storage
    location ~ ^/storage/ {
        deny all;
        return 404;
    }
}

# ── Staging — staging.golivreur.ci ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name staging.golivreur.ci;

    root /var/www/staging/public;
    index index.php;

    # SSL géré par certbot
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12M;

    access_log /var/log/nginx/golivreur_staging_access.log;
    error_log  /var/log/nginx/golivreur_staging_error.log;

    # Accès restreint au staging (développeurs uniquement)
    # Décommenter pour restreindre par IP :
    # allow [IP_LEAD_DEV];
    # allow [IP_FONDATEUR];
    # deny all;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;  # Plus long en staging pour le debug
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1h;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}

