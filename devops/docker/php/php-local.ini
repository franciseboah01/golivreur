; GoLivreur — Configuration PHP locale (développement)
; Ce fichier surcharge php.ini pour le développement local

[PHP]
; Taille maximale des uploads (photos colis GoColis)
upload_max_filesize = 10M
post_max_size = 12M

; Temps max d'exécution — plus long en dev pour le debug
max_execution_time = 120
max_input_time = 120

; Mémoire — suffisante pour Laravel + Filament
memory_limit = 256M

; Afficher les erreurs en développement (désactivé en production)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Timezone Côte d'Ivoire
date.timezone = Africa/Abidjan

[opcache]
; Opcache désactivé en local pour voir les changements de code immédiatement
opcache.enable = 0
