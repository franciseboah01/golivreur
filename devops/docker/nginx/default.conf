# GoLivreur — Configuration Nginx (développement local)
# Proxy vers PHP-FPM sur le container golivreur_app

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Taille max des uploads (photos colis)
    client_max_body_size 12M;

    # Logs visibles avec : docker compose logs -f golivreur_nginx
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Toutes les requêtes passent par index.php (Laravel routing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement PHP via FPM
    location ~ \.php$ {
        fastcgi_pass golivreur_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Photos colis privées servies uniquement via URL signées Laravel (hors public/)
    location ^~ /media/parcel-photos/ {
        try_files /_force_laravel_signed /index.php?$query_string;
    }

    # Fichiers statiques — pas de PHP
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
