  </head><body class="bg-surface-bg text-on-surface font-body-md"><main class="w-full min-h-screen pt-safe pb-safe bg-surface flex flex-col"><div class="flex flex-col w-full px-margin pb-space-xl" id="CLIENT-AUTH-VerificationOTP">
<!-- Top Navigation & Return -->
<div class="flex items-center justify-between py-space-md">
<button aria-label="Retour" class="w-12 h-12 rounded-xl bg-surface-container-low text-text-primary flex items-center justify-center active:scale-95 transition-transform" data-action="nav.back" id="btn-retour">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container-high">
<span class="w-2 h-2 rounded-full bg-feedback-success animate-pulse"></span>
<span class="font-caption-sm text-caption-sm text-text-secondary">Étape 2/2</span>
</div>
</div>
<!-- Header & Context -->
<div class="mt-space-sm mb-space-lg flex flex-col gap-space-xs">
<h1 class="font-headline-lg text-headline-lg text-text-primary">
      Vérification du code
    </h1>
<p class="font-body-md text-body-md text-text-secondary leading-relaxed">
      Entrez le code à 4 chiffres envoyé par SMS au <span class="font-body-md-emphasis text-text-primary">+225 07 01 02 03 04</span>
</p>
<div class="pt-1">
<button class="inline-flex items-center gap-1 font-body-md-emphasis text-body-md text-primary-container active:opacity-75 transition-opacity" data-action="auth.editPhone" id="btn-modifier-numero">
<span>Modifier le numéro</span>
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
</div>
<!-- Security Visual Pill -->
<div class="mb-space-lg p-space-md rounded-xl bg-surface-container-low flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-container shrink-0">
<span class="material-symbols-outlined text-[22px]">sms</span>
</div>
<div class="flex flex-col">
<span class="font-body-md-emphasis text-body-md text-text-primary">SMS sécurisé GoLivreur</span>
<span class="font-caption-sm text-caption-sm text-text-secondary">Réception instantanée estimée en Côte d'Ivoire</span>
</div>
</div>
<!-- OTP Code Input Display -->
<div class="flex flex-col items-center justify-center my-space-md">
<div aria-label="Code de vérification à 4 chiffres" class="flex items-center justify-center gap-3" role="group">
<!-- Input Box 1 -->
<div class="w-14 h-14 rounded-xl bg-surface-card shadow-sm flex items-center justify-center text-[24px] font-bold text-text-primary relative transition-all duration-150" id="input-otp-1">
<span class="otp-digit">4</span>
<div class="absolute bottom-2 w-4 h-0.5 bg-primary-container rounded-full hidden"></div>
</div>
<!-- Input Box 2 -->
<div class="w-14 h-14 rounded-xl bg-surface-card shadow-sm flex items-center justify-center text-[24px] font-bold text-text-primary relative transition-all duration-150" id="input-otp-2">
<span class="otp-digit">9</span>
<div class="absolute bottom-2 w-4 h-0.5 bg-primary-container rounded-full hidden"></div>
</div>
<!-- Input Box 3 (Active Focus state with warm glow/indicator) -->
<div class="w-14 h-14 rounded-xl bg-surface-card shadow-md flex items-center justify-center text-[24px] font-bold text-text-primary relative transition-all duration-150 shadow-primary-container/20" id="input-otp-3">
<span class="otp-digit"></span>
<div class="absolute w-0.5 h-6 bg-primary-container animate-pulse rounded-full"></div>
</div>
<!-- Input Box 4 -->
<div class="w-14 h-14 rounded-xl bg-surface-card shadow-sm flex items-center justify-center text-[24px] font-bold text-text-primary relative transition-all duration-150 opacity-90" id="input-otp-4">
<span class="otp-digit"></span>
<div class="absolute bottom-2 w-4 h-0.5 bg-gray-300 rounded-full opacity-0"></div>
</div>
</div>
</div>
<!-- Countdown & Resend Section -->
<div class="flex flex-col items-center justify-center mt-space-sm mb-space-lg text-center">
<div class="flex items-center gap-1.5 py-1" id="compte-a-rebours-container">
<span class="material-symbols-outlined text-text-secondary text-[18px]">schedule</span>
<span class="font-caption-sm text-caption-sm text-text-secondary" id="texte-compte-a-rebours">
        Renvoyer le code dans <strong class="font-body-md-emphasis text-text-primary" id="valeur-timer">00:45</strong>
</span>
</div>
<button class="mt-1 font-body-md-emphasis text-body-md text-text-disabled cursor-not-allowed transition-colors" data-action="auth.resendOtp" disabled="" id="lien-renvoyer-code">
      Renvoyer un nouveau code
    </button>
</div>
<!-- Primary Verification CTA -->
<div class="w-full mt-auto pt-space-md pb-space-sm">
<button class="w-full min-h-[52px] h-14 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center gap-2 shadow-md active:scale-[0.99] transition-all" data-action="auth.verifyOtp" id="btn-verifier">
<span>Vérifier et continuer</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Custom Tactile Numeric Keypad for Smooth Outdoor Single-Hand Input -->
<div class="w-full mt-space-md pt-space-xs">
<div class="grid grid-cols-3 gap-2 max-w-sm mx-auto select-none">
<!-- 1 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="1" type="button">
<span>1</span>
</button>
<!-- 2 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="2" type="button">
<span>2</span>
</button>
<!-- 3 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="3" type="button">
<span>3</span>
</button>
<!-- 4 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="4" type="button">
<span>4</span>
</button>
<!-- 5 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="5" type="button">
<span>5</span>
</button>
<!-- 6 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="6" type="button">
<span>6</span>
</button>
<!-- 7 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="7" type="button">
<span>7</span>
</button>
<!-- 8 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="8" type="button">
<span>8</span>
</button>
<!-- 9 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="9" type="button">
<span>9</span>
</button>
<!-- Biometrics / Extra Helper -->
<button aria-label="Assistance" class="h-14 rounded-xl bg-transparent text-text-secondary flex items-center justify-center active:bg-surface-container-high transition-colors" data-key="help" type="button">
<span class="material-symbols-outlined text-[24px]">support_agent</span>
</button>
<!-- 0 -->
<button class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary font-headline-md text-headline-md flex flex-col items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="0" type="button">
<span>0</span>
</button>
<!-- Delete / Backspace -->
<button aria-label="Effacer le dernier chiffre" class="keypad-btn h-14 rounded-xl bg-surface-card text-text-primary flex items-center justify-center active:bg-surface-container-high transition-colors shadow-sm" data-key="backspace" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
</div>
</div>
<script>
  (() => {
    // Interactive OTP Keypad handler
    let otpValues = ['4', '9'];
    const maxDigits = 4;
    const boxes = [
      document.getElementById('input-otp-1'),
      document.getElementById('input-otp-2'),
      document.getElementById('input-otp-3'),
      document.getElementById('input-otp-4')
    ];
    const verifyBtn = document.getElementById('btn-verifier');
    const resendBtn = document.getElementById('lien-renvoyer-code');
    const timerValue = document.getElementById('valeur-timer');
    const timerText = document.getElementById('texte-compte-a-rebours');

    function updateOtpDisplay() {
      boxes.forEach((box, idx) => {
        const span = box.querySelector('.otp-digit');
        const val = otpValues[idx] || '';
        span.textContent = val;

        // Clear existing dynamic active pulse cursors
        const cursor = box.querySelector('.animate-pulse');
        if (cursor) cursor.remove();

        if (idx === otpValues.length && idx < maxDigits) {
          // Current active box
          box.classList.add('shadow-md');
          const newCursor = document.createElement('div');
          newCursor.className = 'absolute w-0.5 h-6 bg-primary-container animate-pulse rounded-full';
          box.appendChild(newCursor);
        } else {
          box.classList.remove('shadow-md');
        }
      });

      if (otpValues.length === maxDigits) {
        verifyBtn.classList.add('scale-[1.02]');
      } else {
        verifyBtn.classList.remove('scale-[1.02]');
      }
    }

    // Keypad touches
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        if (key === 'backspace') {
          if (otpValues.length > 0) {
            otpValues.pop();
            updateOtpDisplay();
          }
        } else if (key && !isNaN(key) && otpValues.length < maxDigits) {
          otpValues.push(key);
          updateOtpDisplay();
        }
      });
    });

    // Countdown Timer logic
    let remainingSeconds = 45;
    const countdownInterval = setInterval(() => {
      if (remainingSeconds > 0) {
        remainingSeconds--;
        const formatted = remainingSeconds < 10 ? `00:0${remainingSeconds}` : `00:${remainingSeconds}`;
        if (timerValue) timerValue.textContent = formatted;
      } else {
        clearInterval(countdownInterval);
        if (timerText) timerText.textContent = "Vous n'avez pas reçu le code ?";
        if (resendBtn) {
          resendBtn.disabled = false;
          resendBtn.classList.remove('text-text-disabled', 'cursor-not-allowed');
          resendBtn.classList.add('text-primary-container', 'underline');
        }
      }
    }, 1000);

    // Initial sync
    updateOtpDisplay();
  })();
</script></main></body></html>
