      Se connecter

<p class="font-body-md text-body-md text-text-secondary">

          Numéro de téléphone
        </label>

</div>
<div class="h-5 w-px bg-gray-300 mr-space-sm"></div>
<input autocomplete="tel-national" class="w-full bg-transparent font-body-md text-body-md text-text-primary placeholder:text-text-disabled focus:outline-none" id="phone-input" inputmode="numeric" maxlength="14" placeholder="07 00 00 00 00" type="tel"/>
</div>
</div>
<button class="w-full h-[52px] bg-primary-container active:scale-[0.98] transition-transform rounded-xl flex items-center justify-center gap-space-xs text-on-primary font-label-md text-label-md shadow-sm cursor-pointer" data-action="auth.loginWithPhone" id="btn-connexion-telephone" type="button">
<span>Continuer avec le téléphone</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
<div class="relative flex items-center justify-center my-space-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-px bg-gray-300"></div>
</div>
<span class="relative px-space-md bg-surface font-caption-sm text-caption-sm text-gray-500">
      ou continuer avec
    </span>
</div>
<div class="flex flex-col gap-space-sm mb-space-xl">
<button class="w-full h-[52px] bg-surface-card rounded-xl shadow-sm flex items-center justify-center gap-space-md text-text-primary font-body-md-emphasis text-body-md-emphasis active:scale-[0.98] transition-transform cursor-pointer" data-action="auth.googleLogin" id="btn-connexion-google" type="button">

</svg>
<span>Continuer avec Apple</span>
</button>
</div>
<div class="mt-auto pt-space-md flex flex-wrap items-center justify-center gap-space-xs text-center">
<span class="font-body-md text-body-md text-text-secondary">Nouveau sur GoLivreur ?</span>
<a class="font-body-md-emphasis text-body-md-emphasis text-primary hover:underline cursor-pointer" data-action="nav.toSignup" href="#inscription">
      Créer un compte
    </a>
</div>
</div>
<script>
  (function() {
    const phoneInput = document.getElementById('phone-input');
    if (phoneInput) {
      phoneInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 10) value = value.substring(0, 10);
        let formatted = '';
        for (let i = 0; i < value.length; i++) {
          if (i > 0 && i % 2 === 0) formatted += ' ';
          formatted += value[i];
        }
        e.target.value = formatted;
      });
    }

    const actionButtons = document.querySelectorAll('[data-action]');
    actionButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const action = this.getAttribute('data-action');
        if (action === 'auth.loginWithPhone') {
          const raw = phoneInput.value.replace(/\s+/g, '');
          if (raw.length < 8) {
            phoneInput.parentElement.classList.add('bg-error-container/40');
            setTimeout(() => {
              phoneInput.parentElement.classList.remove('bg-error-container/40');
            }, 1500);
          }
        }
      });
    });
  })();
</script></main></body></html>
