 "gray-900": "#212121", "tertiary-fixed": "#d1e4ff", "border-default": "#E0E0E0", "primary": "#835500", "on-tertiary-fixed-variant": "#00497c" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "16px", "margin": "16px", "space-md": "16px", "space-xs": "4px", "space-xl": "32px", "space-2xl": "48px", "space-lg": "24px", "space-sm": "8px" }, fontFamily: { "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"], "body-md-emphasis": ["Inter"], "caption-sm": ["Inter"] }, fontSize: { "headline-lg": ["28px", { "lineHeight": "34px", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "22px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "body-md-emphasis": ["16px", { "lineHeight": "22px", "fontWeight": "500" }], "caption-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } };</style><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>

  </head><body class="bg-surface-bg min-h-screen flex flex-col pt-safe pb-safe text-on-surface"><main class="flex-1 flex flex-col relative w-full bg-surface-bg"><div class="flex flex-col w-full pb-6 px-4 space-y-4 select-none">
  <!-- Bandeau Supérieur d'Urgence Plein Soleil -->
  <div class="w-full bg-primary-container text-on-surface rounded-xl p-4 shadow-md flex items-center justify-between relative overflow-hidden">
    <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-surface-container-lowest/15 rounded-full pointer-events-none"></div>
    
    <div class="flex items-center space-x-3 z-10 min-w-0">
      <div class="w-12 h-12 rounded-full bg-surface-container-lowest/30 flex items-center justify-center flex-shrink-0 animate-pulse">
        <span class="material-symbols-outlined text-gray-900 text-2xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="font-caption-sm text-caption-sm uppercase tracking-wider font-semibold text-gray-900">GoShop Express • Daloa</span>
        <h1 class="font-headline-sm text-headline-sm text-gray-900 uppercase font-bold truncate">Nouvelle Course</h1>
      </div>
    </div>

    <!-- Compte à rebours 30s interactif SVG -->
    <div class="relative flex items-center justify-center w-14 h-14 flex-shrink-0 z-10">
      <svg class="w-14 h-14 -rotate-90" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" stroke="#f0eded" stroke-width="4.5" fill="none" opacity="0.4" />
        <circle id="timer-ring" cx="24" cy="24" r="20" stroke="#212121" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-dasharray="125.6" stroke-dashoffset="25.1" class="transition-all duration-1000 ease-linear" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span id="compteur-30s" class="font-headline-sm text-headline-sm font-bold text-gray-900 leading-none">24</span>
        <span class="font-caption-sm text-[10px] leading-tight font-semibold text-gray-900 uppercase">sec</span>
      </div>
    </div>
  </div>

  <!-- Carte Centrale de Rémunération Haute Lisibilité -->
  <div class="w-full bg-surface-card rounded-xl p-5 shadow-sm flex flex-col space-y-3">
    <div class="flex items-center justify-between">
      <span class="font-caption-sm text-caption-sm text-text-secondary uppercase tracking-wider font-semibold flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base text-secondary" style="font-variation-settings: 'FILL' 1;">payments</span>
        Gain net garanti
      </span>
      <span class="bg-secondary/10 text-secondary px-2.5 py-1 rounded-md font-caption-sm text-caption-sm font-semibold flex items-center gap-1">
        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
        Course Flash
      </span>
    </div>

    <div class="flex items-baseline space-x-2">
      <span id="gain-estime-affiche" class="font-headline-lg text-headline-lg font-bold text-secondary tracking-tight">
        +1 200 F CFA
      </span>
      <span class="font-body-md text-body-md text-text-secondary">pour vous</span>
    </div>

    <!-- Modalité de collecte espèces -->
    <div class="w-full bg-surface-container-low rounded-lg p-3 flex items-start space-x-3">
      <span class="material-symbols-outlined text-feedback-warning text-xl flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
      <div class="flex flex-col">
        <p class="font-body-md-emphasis text-body-md-emphasis text-gray-900 font-semibold leading-tight">
          Espèces à encaisser à l'arrivée
        </p>
        <p class="font-caption-sm text-caption-sm text-text-secondary mt-0.5">
          Total commande : <strong class="text-gray-900 font-bold">6 500 F CFA</strong> (repas + livraison)
        </p>
      </div>
    </div>
  </div>

  <!-- Carte Itinéraire & Trajet Daloa -->
  <div class="w-full bg-surface-card rounded-xl p-5 shadow-sm flex flex-col space-y-4">
    <div class="flex items-center justify-between pb-3 bg-surface-container-low/50 -mx-5 -mt-5 px-5 pt-4 rounded-t-xl">
      <div class="flex items-center space-x-2 text-gray-900 font-semibold font-body-md-emphasis text-body-md-emphasis">
        <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
        <span>Itinéraire moto optimisé</span>
      </div>
      <div class="bg-gray-900 text-surface-container-lowest px-2.5 py-1 rounded font-label-md text-caption-sm font-bold">
        2.8 km • ~18 min
      </div>
    </div>

    <!-- Étapes de parcours -->
    <div class="relative flex flex-col space-y-6 pt-1">
      <!-- Ligne de trajet verticale stylisée -->
      <div class="absolute left-4 top-4 bottom-5 w-0.5 bg-gray-300"></div>

      <!-- Étape 1 : Retrait Chez Adjoua -->
      <div class="relative flex items-start space-x-3 min-w-0">
        <div class="w-8 h-8 rounded-full bg-primary-container text-gray-900 flex items-center justify-center flex-shrink-0 shadow-sm z-10 ring-4 ring-surface-card">
          <span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">storefront</span>
        </div>
        <div class="flex flex-col flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <span class="font-caption-sm text-caption-sm font-bold uppercase text-primary tracking-wide">1. Retrait Restaurant</span>
            <span class="bg-secondary/10 text-secondary font-caption-sm text-caption-sm px-2 py-0.5 rounded font-semibold">Prête #ORD-5002</span>
          </div>
          <span class="font-headline-sm text-body-md-emphasis font-bold text-gray-900 truncate mt-0.5">Chez Adjoua</span>
          <span class="font-caption-sm text-caption-sm text-text-secondary truncate">Quartier Commerce, Daloa (Face Grande Pharmacie)</span>
          <span class="font-caption-sm text-caption-sm text-text-secondary mt-1 flex items-center gap-1 font-medium">
            <span class="material-symbols-outlined text-xs">takeout_dining</span> 2 plats chauds emballés hermétiques
          </span>
        </div>
      </div>

      <!-- Distance intermédiaire -->
      <div class="pl-11 -my-2 flex items-center space-x-2 text-text-secondary">
        <span class="material-symbols-outlined text-sm rotate-90 text-gray-500">arrow_right_alt</span>
        <span class="font-caption-sm text-caption-sm text-text-disabled font-medium">1.1 km à moto vers client</span>
      </div>

      <!-- Étape 2 : Livraison Aïcha Traoré -->
      <div class="relative flex items-start space-x-3 min-w-0">
        <div class="w-8 h-8 rounded-full bg-secondary text-surface-container-lowest flex items-center justify-center flex-shrink-0 shadow-sm z-10 ring-4 ring-surface-card">
          <span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">person_pin_circle</span>
        </div>
        <div class="flex flex-col flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <span class="font-caption-sm text-caption-sm font-bold uppercase text-secondary tracking-wide">2. Livraison Client</span>
            <span class="font-caption-sm text-caption-sm text-text-secondary font-medium">Porte-à-porte</span>
          </div>
          <span class="font-headline-sm text-body-md-emphasis font-bold text-gray-900 truncate mt-0.5">Aïcha Traoré</span>
          <span class="font-caption-sm text-caption-sm text-text-secondary">Quartier Soleil, Daloa (Grand immeuble bleu, 2e étage)</span>
          <div class="flex items-center gap-2 mt-1">
            <span class="bg-surface-container text-gray-700 font-caption-sm text-[11px] px-2 py-0.5 rounded font-medium">
              Repère : Face École Primaire
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Précisions Équipement Livreur Moto -->
  <div class="w-full bg-surface-container-low rounded-xl p-3.5 flex items-center space-x-3">
    <div class="w-10 h-10 rounded-lg bg-surface-card flex items-center justify-center text-secondary flex-shrink-0 shadow-sm">
      <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">backpack</span>
    </div>
    <div class="flex flex-col min-w-0">
      <span class="font-body-md-emphasis text-body-md-emphasis text-gray-900 font-semibold leading-snug">
        Sac isotherme GoLivreur requis
      </span>
      <span class="font-caption-sm text-caption-sm text-text-secondary truncate">
        Conserver les plats à l'abri du vent et de la poussière.
      </span>
    </div>
  </div>

  <!-- Actions Tactiles Conduite Moto (Hauteur min 52px) -->
  <div class="flex flex-col space-y-3 pt-1">
    <!-- Bouton Accepter (Priorité Absolue) -->
    <button 
      id="btn-accepter-course" 
      data-action="job.accept" 
      class="w-full h-14 min-h-[56px] bg-secondary text-surface-container-lowest rounded-xl font-label-md text-label-md flex items-center justify-center space-x-2 font-bold shadow-md active:scale-[0.98] transition-transform"
    >
      <span class="material-symbols-outlined text-2xl font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
      <span class="tracking-wide">ACCEPTER LA COURSE (+1 200 F CFA)</span>
    </button>

    <!-- Bouton Refuser -->
    <button 
      id="btn-refuser-course" 
      data-action="job.refuse" 
      class="w-full h-13 min-h-[52px] bg-surface-card text-feedback-error rounded-xl font-label-md text-label-md flex items-center justify-center space-x-2 font-semibold shadow-sm active:bg-error-container/20 transition-colors"
    >
      <span class="material-symbols-outlined text-xl">close</span>
      <span>Refuser et passer la main</span>
    </button>
  </div>
</div>

<script>
  (function() {
    let timeLeft = 24;
    const totalTime = 30;
    const perimeter = 125.6; // 2 * PI * 20
    const counterEl = document.getElementById('compteur-30s');
    const ringEl = document.getElementById('timer-ring');
    const btnAccept = document.getElementById('btn-accepter-course');
    const btnRefuse = document.getElementById('btn-refuser-course');

    const updateTimer = () => {
      if (counterEl && ringEl) {
        counterEl.textContent = timeLeft;
        const offset = perimeter - (timeLeft / totalTime) * perimeter;
        ringEl.style.strokeDashoffset = offset;
      }
    };

    updateTimer();

    const timerInterval = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        if (counterEl) counterEl.textContent = "0";
        if (ringEl) ringEl.style.strokeDashoffset = perimeter;
        if (btnRefuse) btnRefuse.click();
      } else {
        updateTimer();
      }
    }, 1000);

    if (btnAccept) {
      btnAccept.addEventListener('click', () => {
        clearInterval(timerInterval);
        btnAccept.innerHTML = '<span class="material-symbols-outlined animate-spin text-2xl">progress_activity</span><span>COURSE ATTRIBUÉE !</span>';
        btnAccept.classList.replace('bg-secondary', 'bg-feedback-success');
      });
    }

    if (btnRefuse) {
      btnRefuse.addEventListener('click', () => {
        clearInterval(timerInterval);
        btnRefuse.disabled = true;
        btnRefuse.classList.add('opacity-50');
      });
    }
  })();
</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
